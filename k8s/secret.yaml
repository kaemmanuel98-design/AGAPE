apiVersion: v1
kind: Secret
metadata:
  name: agape-secrets
  namespace: agape
  labels:
    app.kubernetes.io/name: agape
type: Opaque
stringData:
  # Remplacer par tes vraies valeurs avant `kubectl apply`, ou injecter via CI (Sealed Secrets / External Secrets recommandés en prod).
  NEXT_PUBLIC_SUPABASE_URL: "https://YOUR-PROJECT.supabase.co"
  NEXT_PUBLIC_SUPABASE_ANON_KEY: "YOUR_ANON_KEY"
