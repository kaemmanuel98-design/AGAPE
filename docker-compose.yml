# Environnement local type production (Next.js sur le port 3000).
# 1) Copier `.env.docker.example` vers `.env.docker` et renseigner Supabase.
# 2) `docker compose up --build`
# 3) (Optionnel) Agrégation des logs : `docker compose --profile logs up -d`

services:
  agape-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
    image: agape-app:local
    container_name: agape-web
    ports:
      - "3000:3000"
    env_file:
      - .env.docker
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
      AGAPE_SUBDOMAIN_ROUTING: ${AGAPE_SUBDOMAIN_ROUTING:-false}
      AGAPE_BIBLE_HOST: ${AGAPE_BIBLE_HOST:-bible.agape.com}
      AGAPE_ACADEMY_HOST: ${AGAPE_ACADEMY_HOST:-academy.agape.com}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    restart: unless-stopped

  vector:
    image: timberio/vector:0.41.1-debian
    container_name: agape-vector
    profiles:
      - logs
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./infra/vector/vector.yaml:/etc/vector/vector.yaml:ro
      - agape_log_archive:/archive
    command: ["--config", "/etc/vector/vector.yaml"]
    restart: unless-stopped
    depends_on:
      agape-web:
        condition: service_healthy

volumes:
  agape_log_archive:
    driver: local
