apiVersion: v1
kind: ConfigMap
metadata:
  name: agape-config
  namespace: agape
  labels:
    app.kubernetes.io/name: agape
data:
  NODE_ENV: "production"
  NEXT_PUBLIC_SITE_URL: "https://academy.agape.com"
  # Routage par sous-domaine (middleware Next.js) — aligner avec les Ingress.
  AGAPE_SUBDOMAIN_ROUTING: "true"
  AGAPE_BIBLE_HOST: "bible.agape.com"
  AGAPE_ACADEMY_HOST: "academy.agape.com"
