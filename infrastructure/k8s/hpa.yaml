apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: agape-web
  namespace: agape
  labels:
    app.kubernetes.io/name: agape
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: agape-web
  minReplicas: 2
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
